name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'workers/mail-worker/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: self-hosted
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Create .env.production file
        run: |
          cat > .env.production << EOF
          # ========================================
          # Google Maps Configuration
          # ========================================
          VITE_GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAP_ID=${{ secrets.GOOGLE_MAP_ID }}

          # ========================================
          # Contact Form Configuration
          # ========================================
          VITE_MAIL_WORKER_MODE=prod
          VITE_MAIL_WORKER_ENDPOINT=${{ secrets.MAIL_WORKER_ENDPOINT }}
          VITE_TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}
          EOF

      - name: Install dependencies
        run: npm install

      - name: Generate Development Certificate
        run: node scripts/generate_development_certificate.js

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build project
        run: npm run prod

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=artek

      - name: Cleanup workspace
        if: always()
        run: |
          rm -f .env.production
          rm -rf certs dist .wrangler node_modules