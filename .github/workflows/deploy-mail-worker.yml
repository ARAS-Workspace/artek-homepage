name: Deploy Mail Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/mail-worker/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: self-hosted
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'

      - name: Create .env file
        working-directory: workers/mail-worker
        run: |
          cat > .env << EOF
          #  █████╗ ██████╗  █████╗ ███████╗
          # ██╔══██╗██╔══██╗██╔══██╗██╔════╝
          # ███████║██████╔╝███████║███████╗
          # ██╔══██║██╔══██╗██╔══██║╚════██║
          # ██║  ██║██║  ██║██║  ██║███████║
          # ╚═╝  ╚═╝╚═╝  ╚═╝╚═╝  ╚═╝╚══════╝

          # Cloudflare Authentication for Wrangler CLI
          # These variables are used by wrangler for deploy/dev commands
          # Do NOT put worker runtime secrets here - use .dev.vars for development

          # Cloudflare API Token
          # Create at: https://dash.cloudflare.com/profile/api-tokens
          # Required permissions: Edit Cloudflare Workers
          CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}

          # Cloudflare Account ID
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EOF

      - name: Install dependencies
        working-directory: workers/mail-worker
        run: npm ci

      - name: Generate TypeScript types
        working-directory: workers/mail-worker
        run: npm run cf-typegen

      - name: Deploy to Cloudflare Workers
        working-directory: workers/mail-worker
        run: npm run deploy

      - name: Cleanup workspace
        if: always()
        working-directory: workers/mail-worker
        run: |
          rm -f .env
          rm -rf .wrangler node_modules